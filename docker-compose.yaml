version: "3.8"

# ─────────────────────────────────────────────────────────────────────────────
# Xenode — Production Docker Compose
#
# MongoDB, Redis, and B2 storage are external managed services.
# All connection strings and secrets come from environment variables
# (set in Coolify or a .env file alongside this compose file).
#
# Required env vars — set all of these in Coolify:
#
#   ACCOUNTS_ORIGIN / DRIVE_ORIGIN / PHOTOS_ORIGIN   Exact product origins
#   NEXT_PUBLIC_APP_URL       Public Drive URL (e.g. https://xenode.in)
#
#   MONGODB_URI               MongoDB Atlas / self-hosted connection string
#   MONGODB_LOGS_URI          Separate DB for logs (can be same cluster)
#   REDIS_URL                 Redis connection URL (e.g. redis://host:6379)
#
#   BETTER_AUTH_SECRET        32+ char Accounts identity secret
#   REALTIME_TICKET_SECRET    Independent 32+ char realtime ticket secret
#   CDN_SIGNING_SECRET        Independent 32+ char CDN signing secret
#   REALTIME_ALLOWED_ORIGIN   Exact comma-separated product origins
#
#   ADMIN_USERNAME            Initial super-admin username
#   ADMIN_PASSWORD            Initial super-admin password
#   ADMIN_JWT_SECRET          32+ char secret for admin JWT sessions
#
#   S3_KEY_ID / S3_APPLICATION_KEY / S3_BUCKET_NAME / S3_ENDPOINT / S3_REGION
#                              Backblaze B2 S3-compatible system bucket
#
#   RESEND_API_KEY            Resend transactional email API key
#
#   CRON_SECRET               Random secret for cron job auth (Bearer token)
#
#   RAZORPAY_KEY_ID           Razorpay key ID
#   RAZORPAY_KEY_SECRET       Razorpay key secret
#   RAZORPAY_WEBHOOK_SECRET   Webhook signature secret
#   RAZORPAY_SUBSCRIPTION_WEBHOOK_SECRET  Subscription webhook secret
#   NEXT_PUBLIC_RAZORPAY_KEY_ID           Razorpay key ID (browser-visible)
#
# Optional env vars:
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET   Google OAuth
#   GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET   GitHub OAuth
#   NEXT_PUBLIC_POSTHOG_KEY                   PostHog analytics
#   NEXT_PUBLIC_POSTHOG_HOST
#   POSTHOG_KEY
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Drive Next.js app ───────────────────────────────────────────────────────
  drive:
    build:
      context: .
      dockerfile: apps/drive/Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"

      # ── App ───────────────────────────────────────────────────────────────
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      ACCOUNTS_ORIGIN: ${ACCOUNTS_ORIGIN}
      DRIVE_ORIGIN: ${DRIVE_ORIGIN}
      PHOTOS_ORIGIN: ${PHOTOS_ORIGIN}
      NEXT_PUBLIC_ACCOUNTS_ORIGIN: ${NEXT_PUBLIC_ACCOUNTS_ORIGIN}
      NEXT_PUBLIC_DRIVE_ORIGIN: ${NEXT_PUBLIC_DRIVE_ORIGIN}
      NEXT_PUBLIC_PHOTOS_ORIGIN: ${NEXT_PUBLIC_PHOTOS_ORIGIN}

      # ── Database & Cache (external managed services) ───────────────────────
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_LOGS_URI: ${MONGODB_LOGS_URI}
      REDIS_URL: ${REDIS_URL}

      # ── Auth, realtime, and CDN (all secrets must be distinct) ───────────
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      REALTIME_TICKET_SECRET: ${REALTIME_TICKET_SECRET}
      CDN_SIGNING_SECRET: ${CDN_SIGNING_SECRET}
      REALTIME_ALLOWED_ORIGIN: ${REALTIME_ALLOWED_ORIGIN}

      # ── Admin panel ────────────────────────────────────────────────────────
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}

      # ── Cloudflare R2 S3-compatible system bucket ─────────────────────────
      S3_KEY_ID: ${S3_KEY_ID}
      S3_APPLICATION_KEY: ${S3_APPLICATION_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}

      # ── Email ──────────────────────────────────────────────────────────────
      RESEND_API_KEY: ${RESEND_API_KEY}

      # ── Cron ───────────────────────────────────────────────────────────────
      CRON_SECRET: ${CRON_SECRET}

      # ── Payments (Razorpay) ────────────────────────────────────────────────
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RAZORPAY_SUBSCRIPTION_WEBHOOK_SECRET: ${RAZORPAY_SUBSCRIPTION_WEBHOOK_SECRET}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID}

      # ── OAuth (optional) ───────────────────────────────────────────────────
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

      # ── Analytics (optional) ───────────────────────────────────────────────
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
      POSTHOG_KEY: ${POSTHOG_KEY:-}

  # ── Scheduler ───────────────────────────────────────────────────────────────
  # Runs every product's vercel.json crons against that product's origin; the
  # secret stays out of the crontab, command lines and logs (Dockerfile.cron).
  cron:
    build:
      context: .
      dockerfile: Dockerfile.cron
    restart: unless-stopped
    depends_on:
      - drive
    environment:
      DRIVE_URL: http://drive:3000
      PHOTOS_URL: ${PHOTOS_URL}
      CRON_SECRET: ${CRON_SECRET}

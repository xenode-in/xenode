name: Security gates

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run test:security
      - run: npm run test
      - run: npm run build
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/xenode-ci
          BETTER_AUTH_SECRET: ci-better-auth-secret-000000000000000000000000
          ADMIN_JWT_SECRET: ci-admin-jwt-secret-0000000000000000000000000
          REALTIME_TICKET_SECRET: ci-realtime-ticket-secret-000000000000000000000
          CDN_SIGNING_SECRET: ci-cdn-signing-secret-000000000000000000000000
          CRON_SECRET: ci-cron-secret-000000000000000000000000000
          REALTIME_ALLOWED_ORIGIN: https://xenode.in,https://photos.xenode.in
          ACCOUNTS_ORIGIN: https://accounts.xenode.in
          DRIVE_ORIGIN: https://xenode.in
          PHOTOS_ORIGIN: https://photos.xenode.in
          NEXT_PUBLIC_ACCOUNTS_ORIGIN: https://accounts.xenode.in
          NEXT_PUBLIC_DRIVE_ORIGIN: https://xenode.in
          NEXT_PUBLIC_PHOTOS_ORIGIN: https://photos.xenode.in
          SAFE_PREVIEW_GLOBAL_ENABLED: "false"
          ONLYOFFICE_V2_ENABLED: "false"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

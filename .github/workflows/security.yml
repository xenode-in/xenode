name: Security gates

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Release gate: any published advisory (runtime or tooling) needs triage.
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run test:security
      - run: npm run test
      # A build needs no secret or database; origins are compiled in.
      - run: npm run build
        env:
          ACCOUNTS_ORIGIN: https://accounts.xenode.in
          DRIVE_ORIGIN: https://xenode.in
          PHOTOS_ORIGIN: https://photos.xenode.in
          NEXT_PUBLIC_ACCOUNTS_ORIGIN: https://accounts.xenode.in
          NEXT_PUBLIC_DRIVE_ORIGIN: https://xenode.in
          NEXT_PUBLIC_PHOTOS_ORIGIN: https://photos.xenode.in
          SAFE_PREVIEW_GLOBAL_ENABLED: "false"
          ONLYOFFICE_V2_ENABLED: "false"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

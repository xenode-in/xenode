server {
  listen 8080;
  server_name preview.xenode.in;
  server_tokens off;
  access_log off;

  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src blob: data:; media-src blob:; worker-src 'self' blob:; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors https://xenode.in; navigate-to 'none'" always;
  add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Cache-Control "public, max-age=31536000, immutable" always;

  location = / {
    try_files /index.html =404;
  }
  location = /index.html {
    try_files $uri =404;
  }
  location = /runtime.js {
    default_type application/javascript;
    try_files $uri =404;
  }
  location / {
    return 404;
  }
}
